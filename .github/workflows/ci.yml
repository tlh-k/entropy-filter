name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: fixtures are up to date
        run: |
          npm run fixtures
          git diff --exit-code -- test/fixtures || (echo "::error::test/fixtures is stale; run npm run fixtures and commit" && exit 1)
      - name: unit tests + recall gate
        run: npm test
      - name: dist is up to date
        run: |
          npm run build
          git diff --exit-code -- dist rules || (echo "::error::dist/ is stale; run npm run build and commit" && exit 1)
      - name: e2e on the built bundle
        run: npm run test:e2e
